name: Release Evidence

# Independent, read-only reconciliation of every completed operator Release run.
# No-releasable and rejected runs are recorded explicitly; once the protected
# reusable publisher starts, missing or inconsistent publication is a failure.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

concurrency:
  group: release-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-published-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Seed forensic evidence
        if: always()
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p verification-evidence
          jq -n \
            --arg run_id "$UPSTREAM_RUN_ID" \
            --arg run_attempt "$UPSTREAM_RUN_ATTEMPT" \
            --arg conclusion "$UPSTREAM_CONCLUSION" \
            --arg head_sha "$UPSTREAM_HEAD_SHA" \
            '{decision_contract:"frontcomposer.release-run-disposition.v2",status:"unclassified",governed_attempt:null,run_id:$run_id,run_attempt:$run_attempt,conclusion:$conclusion,head_sha:$head_sha}' \
            > verification-evidence/release-disposition.json

      - name: Authenticate and classify the operator Release run
        id: disposition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}" \
            > verification-evidence/upstream-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/attempts/${UPSTREAM_RUN_ATTEMPT}/jobs?per_page=100" \
            > verification-evidence/upstream-jobs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          def closed(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate API member: {key}")
                  value[key] = item
              return value

          def load(name):
              return json.loads(Path(name).read_text(), object_pairs_hook=closed)

          run = load("verification-evidence/upstream-run.json")
          envelope = load("verification-evidence/upstream-jobs.json")
          jobs = envelope.get("jobs") if isinstance(envelope, dict) else None
          if not isinstance(run, dict) or not isinstance(jobs, list):
              raise SystemExit("malformed Release run/jobs API response")
          if envelope.get("total_count") != len(jobs):
              raise SystemExit("ambiguous or paginated Release jobs API response")
          expected = {
              "id": int(os.environ["UPSTREAM_RUN_ID"]),
              "run_attempt": int(os.environ["UPSTREAM_RUN_ATTEMPT"]),
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": os.environ["UPSTREAM_CONCLUSION"],
              "head_branch": "main",
              "head_sha": os.environ["UPSTREAM_HEAD_SHA"],
              "path": ".github/workflows/release.yml",
          }
          if any(run.get(key) != value for key, value in expected.items()):
              raise SystemExit("Release run coordinate does not match the authenticated operator dispatch")
          if re.fullmatch(r"[0-9a-f]{40}", run["head_sha"]) is None:
              raise SystemExit("Release run head SHA is malformed")
          if any(not isinstance(job, dict) or job.get("status") != "completed" for job in jobs):
              raise SystemExit("Release job topology is malformed or incomplete")
          known = {"verify-source", "plan-release", "prepare-candidate", "release", "release / release", "verify-publication"}
          names = [job.get("name") for job in jobs]
          if any(name not in known for name in names) or len(names) != len(set(names)):
              raise SystemExit(f"Release job topology is unknown or ambiguous: {names}")
          by_name = {job["name"]: job for job in jobs}
          for required in ("verify-source", "plan-release"):
              if required not in by_name:
                  raise SystemExit(f"Release job topology lacks {required}")
          governed = by_name.get("release / release")
          if governed is not None and governed.get("conclusion") not in {"skipped", None}:
              disposition = "governed-publication-attempt"
              governed_attempt = True
          elif run.get("conclusion") == "success" and by_name["verify-source"].get("conclusion") == "success" and by_name["plan-release"].get("conclusion") == "success":
              for publication_job in ("prepare-candidate", "release", "verify-publication"):
                  if publication_job in by_name and by_name[publication_job].get("conclusion") != "skipped":
                      raise SystemExit(f"successful no-release topology unexpectedly ran {publication_job}")
              disposition = "no-releasable-commits"
              governed_attempt = False
          else:
              disposition = "rejected-before-publication"
              governed_attempt = False
          result = {
              "decision_contract": "frontcomposer.release-run-disposition.v2",
              "status": disposition,
              "governed_attempt": governed_attempt,
              "run_id": run["id"],
              "run_attempt": run["run_attempt"],
              "conclusion": run["conclusion"],
              "head_sha": run["head_sha"],
              "jobs": [{"name": job["name"], "conclusion": job.get("conclusion")} for job in jobs],
          }
          Path("verification-evidence/release-disposition.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(f"governed-attempt={'true' if governed_attempt else 'false'}")
          print(f"disposition={disposition}")
          print(f"candidate={run['head_sha']}")
          PY

      - name: Record explicit non-publication disposition
        if: steps.disposition.outputs.governed-attempt == 'false'
        env:
          DISPOSITION: ${{ steps.disposition.outputs.disposition }}
        run: |
          echo "Release disposition: ${DISPOSITION}. This run did not publish a release." >> "$GITHUB_STEP_SUMMARY"
          jq -n \
            --arg disposition "$DISPOSITION" \
            '{decision_contract:"frontcomposer.release-ledger-record.v2",published:false,disposition:$disposition,status:"recorded"}' \
            > verification-evidence/ledger-record.json

      - name: Authenticate prepared-candidate coordinate
        id: candidate
        if: steps.disposition.outputs.governed-attempt == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_SHA: ${{ steps.disposition.outputs.candidate }}
        run: |
          set -euo pipefail
          artifact_name="release-candidate-${UPSTREAM_RUN_ID}-${UPSTREAM_RUN_ATTEMPT}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/artifacts?per_page=100" \
            > verification-evidence/upstream-artifacts.json
          python3 - "$artifact_name" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          payload = json.loads(Path("verification-evidence/upstream-artifacts.json").read_text())
          artifacts = payload.get("artifacts") if isinstance(payload, dict) else None
          if not isinstance(artifacts, list) or payload.get("total_count") != len(artifacts):
              raise SystemExit("malformed or ambiguous Release artifact API response")
          matches = [row for row in artifacts if isinstance(row, dict) and row.get("name") == sys.argv[1] and row.get("expired") is False]
          if len(matches) != 1 or not isinstance(matches[0].get("id"), int):
              raise SystemExit(f"expected exactly one prepared-candidate artifact; found {len(matches)}")
          print(f"artifact-id={matches[0]['id']}")
          PY
          artifact_id="$(python3 -c 'import json; p=json.load(open("verification-evidence/upstream-artifacts.json")); print(next(a["id"] for a in p["artifacts"] if a.get("name")=="'"$artifact_name"'" and a.get("expired") is False))')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > verification-evidence/prepared-candidate.zip
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("verification-evidence/prepared-candidate.zip")
          with zipfile.ZipFile(archive) as source:
              names = source.namelist()
              if any(PurePosixPath(name).is_absolute() or ".." in PurePosixPath(name).parts for name in names):
                  raise SystemExit("prepared-candidate archive contains an unsafe path")
              descriptor_names = [name for name in names if name == "release-evidence/prepared-candidate.json"]
              if len(descriptor_names) != 1:
                  raise SystemExit("prepared-candidate archive lacks its unique descriptor")
              descriptor = json.loads(source.read(descriptor_names[0]))
          required = {"schema", "source_sha", "version", "run_id", "run_attempt", "files"}
          if not isinstance(descriptor, dict) or set(descriptor) != required:
              raise SystemExit("prepared-candidate descriptor is malformed")
          if descriptor["schema"] != "hexalith.frontcomposer.prepared-candidate.v1":
              raise SystemExit("prepared-candidate descriptor schema mismatch")
          if descriptor["source_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("prepared-candidate source SHA mismatch")
          if descriptor["run_id"] != int(os.environ["UPSTREAM_RUN_ID"]) or descriptor["run_attempt"] != int(os.environ["UPSTREAM_RUN_ATTEMPT"]):
              raise SystemExit("prepared-candidate run identity mismatch")
          if not isinstance(descriptor["version"], str) or re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[+-][0-9A-Za-z.-]+)?", descriptor["version"]) is None:
              raise SystemExit("prepared-candidate version is malformed")
          print(f"version={descriptor['version']}")
          print(f"tag=v{descriptor['version']}")
          PY

      - name: Checkout exact released source
        if: steps.disposition.outputs.governed-attempt == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.disposition.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Checkout approved Builds actions
        if: steps.disposition.outputs.governed-attempt == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Hexalith/Hexalith.Builds
          ref: a53166539bf4441d5e33d04281b14c2d59e950c3
          path: .hexalith/builds-execution
          persist-credentials: false

      - name: Initialize exact root-declared dependencies
        if: steps.disposition.outputs.governed-attempt == 'true'
        uses: ./.hexalith/builds-execution/Github/initialize-build

      - name: Initialize .NET
        if: steps.disposition.outputs.governed-attempt == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Require exact immutable GitHub Release
        if: steps.disposition.outputs.governed-attempt == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          EXPECTED_SHA: ${{ steps.disposition.outputs.candidate }}
        run: |
          set -euo pipefail
          incident() {
            jq -n --arg phase "$1" --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" \
              '{decision_contract:"frontcomposer.partial-publish-incident.v2",classification:"partial-publish-incident",failed_phase:$phase,tag:$tag,source_sha:$sha}' \
              > verification-evidence/partial-publish-incident.json
          }
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > verification-evidence/github-release.json; then
            incident github-release
            echo "A governed publication attempt produced no GitHub Release." >&2
            exit 1
          fi
          if ! jq -e --arg tag "$RELEASE_TAG" '
            type == "object" and .tag_name == $tag and .draft == false and .immutable == true and
            (.id | type == "number") and (.assets | type == "array") and (.assets | length > 0)
          ' verification-evidence/github-release.json > /dev/null; then
            incident github-release
            echo "GitHub Release metadata is mutable, draft, empty, or malformed." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > verification-evidence/tag-ref.json
          echo '[]' > verification-evidence/tag-objects.json
          object_type="$(jq -er '.object.type' verification-evidence/tag-ref.json)"
          object_sha="$(jq -er '.object.sha' verification-evidence/tag-ref.json)"
          for _ in 1 2 3 4 5; do
            [ "$object_type" = "commit" ] && break
            if [ "$object_type" != "tag" ] || [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              incident tag-push
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" > verification-evidence/tag-object.json
            jq --slurpfile item verification-evidence/tag-object.json '. + $item' \
              verification-evidence/tag-objects.json > verification-evidence/tag-objects.next.json
            mv verification-evidence/tag-objects.next.json verification-evidence/tag-objects.json
            object_type="$(jq -er '.object.type' verification-evidence/tag-object.json)"
            object_sha="$(jq -er '.object.sha' verification-evidence/tag-object.json)"
          done
          if [ "$object_type" != "commit" ] || [ "$object_sha" != "$EXPECTED_SHA" ]; then
            incident tag-push
            echo "GitHub Release tag does not resolve to the dispatched source SHA." >&2
            exit 1
          fi
          python3 eng/release_contract.py publication \
            --expected-sha "$EXPECTED_SHA" \
            --expected-tag "$RELEASE_TAG" \
            --release verification-evidence/github-release.json \
            --tag-ref verification-evidence/tag-ref.json \
            --tag-objects verification-evidence/tag-objects.json \
            --require-immutable

      - name: Download durable release assets
        if: steps.disposition.outputs.governed-attempt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p downloaded/github nupkgs release-evidence
          gh release download "$RELEASE_TAG" --dir downloaded/github
          shopt -s nullglob
          for file in downloaded/github/*.nupkg; do cp "$file" "nupkgs/$(basename "$file")"; done
          for file in downloaded/github/*.snupkg; do cp "$file" "nupkgs/$(basename "$file")"; done
          for file in downloaded/github/*.json downloaded/github/*.txt downloaded/github/*.md; do cp "$file" "release-evidence/$(basename "$file")"; done
          for required in sealed-manifest.json release-readiness.json checksums.json package-inventory.json dependency-release-source.json release-verification.json; do
            if [ ! -f "release-evidence/$required" ]; then
              python3 eng/release_evidence.py partial-publish-incident \
                --manifest "${PWD}/release-evidence/sealed-manifest.json" \
                --output verification-evidence/partial-publish-incident.json \
                --phase github-release \
                --tag "$RELEASE_TAG"
              echo "GitHub Release lacks durable evidence asset $required." >&2
              exit 1
            fi
          done

      - name: Verify sealed manifest over downloaded bytes
        if: steps.disposition.outputs.governed-attempt == 'true'
        run: |
          python3 eng/release_evidence.py verify-manifest \
            --manifest release-evidence/sealed-manifest.json \
            --root . \
            --graph-root . \
            --output verification-evidence/manifest-verification.json

      - name: Download NuGet bytes and verify exact publication
        if: steps.disposition.outputs.governed-attempt == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          EXPECTED_SHA: ${{ steps.disposition.outputs.candidate }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          manifest = json.loads(pathlib.Path("release-evidence/sealed-manifest.json").read_text())
          checksums = json.loads(pathlib.Path("release-evidence/checksums.json").read_text())
          readiness = json.loads(pathlib.Path("release-evidence/release-readiness.json").read_text())
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          failures = []
          comparison = []
          destination = pathlib.Path("downloaded/nuget")
          destination.mkdir(parents=True, exist_ok=True)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def fail(message):
              failures.append(message)
              print(f"::error::{message}")

          if manifest.get("tag") != tag or manifest.get("commit_sha") != os.environ["EXPECTED_SHA"]:
              fail("sealed manifest tag/source does not match the authenticated release")
          if readiness.get("publish_authorized") is not True or readiness.get("classification") not in {"ready", "fallback-approved"}:
              fail("published release was not authorized by its sealed readiness evidence")
          rows = manifest.get("packages")
          if not isinstance(rows, list) or len(rows) != 8:
              fail("sealed package count is not exactly eight")
              rows = []
          expected_assets = set()
          for row in rows:
              package_id = str(row.get("package_id", ""))
              if row.get("version") != version:
                  fail(f"{package_id}: version differs from release plan")
              package_name = pathlib.PurePosixPath(str(row.get("artifact_path", ""))).name
              expected_assets.add(package_name)
              github_path = pathlib.Path("nupkgs") / package_name
              if not github_path.is_file() or digest(github_path) != row.get("checksum"):
                  fail(f"{package_id}: GitHub package asset is missing or divergent")
                  continue
              url = f"https://api.nuget.org/v3-flatcontainer/{package_id.lower()}/{version}/{package_id.lower()}.{version}.nupkg"
              target = destination / package_name
              deadline = time.monotonic() + 12 * 60
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=60) as response:
                          target.write_bytes(response.read())
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 404 or time.monotonic() >= deadline:
                          fail(f"{package_id}: NuGet package unavailable (HTTP {error.code})")
                          break
                      time.sleep(30)
                  except (OSError, TimeoutError, urllib.error.URLError) as error:
                      if time.monotonic() >= deadline:
                          fail(f"{package_id}: NuGet package unavailable ({type(error).__name__})")
                          break
                      time.sleep(30)
              if target.is_file():
                  content_check = subprocess.run(
                      [
                          "python3", "eng/release_contract.py", "package-content",
                          "--candidate", str(github_path),
                          "--published", str(target),
                      ],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if content_check.returncode != 0:
                      fail(f"{package_id}: NuGet content differs beyond the repository signature")
                  else:
                      comparison.append({"package_id": package_id, **json.loads(content_check.stdout)})
              symbol_name = pathlib.PurePosixPath(str(row.get("symbol_artifact", ""))).name
              if symbol_name.endswith(".snupkg"):
                  expected_assets.add(symbol_name)
                  symbol = pathlib.Path("nupkgs") / symbol_name
                  if not symbol.is_file() or digest(symbol) != row.get("symbol_checksum"):
                      fail(f"{package_id}: symbol asset is missing or divergent")
          actual_assets = {path.name for path in pathlib.Path("downloaded/github").iterdir() if path.suffix in {".nupkg", ".snupkg"}}
          if actual_assets != expected_assets:
              fail("GitHub package assets differ from the sealed package/symbol inventory")
          checksum_rows = checksums.get("files") if isinstance(checksums, dict) else None
          if not isinstance(checksum_rows, list):
              fail("downloaded checksum evidence is malformed")
              checksum_rows = []
          for sealed in checksum_rows:
              if not isinstance(sealed, dict):
                  fail("downloaded checksum evidence contains a malformed row")
                  continue
              path = str(sealed.get("path", "")).replace("\\", "/")
              local = pathlib.Path(path)
              if not local.is_file() or digest(local) != sealed.get("sha256"):
                  fail(f"published asset/evidence bytes differ from checksums.json: {path}")
          sbom = pathlib.Path("release-evidence/sbom.json")
          if not sbom.is_file() or digest(sbom) != manifest.get("sbom_hash"):
              fail("published SBOM bytes differ from the sealed manifest")
          payload = {"decision_contract":"frontcomposer.published-byte-comparison.v2","tag":tag,"packages":comparison,"failures":failures,"status":"verified" if not failures else "divergent"}
          pathlib.Path("verification-evidence/published-byte-comparison.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          if failures:
              subprocess.run(["python3", "eng/release_evidence.py", "partial-publish-incident", "--manifest", "release-evidence/sealed-manifest.json", "--output", "verification-evidence/partial-publish-incident.json", "--phase", "post-seal-verification", "--tag", tag], check=False)
              sys.exit(1)
          PY

      - name: Verify NuGet.org repository signatures of served bytes
        if: steps.disposition.outputs.governed-attempt == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          status=0
          dotnet nuget verify downloaded/nuget/*.nupkg --all -v normal \
            > verification-evidence/published-repository-signatures.txt 2>&1 || status=$?
          mapfile -t package_ids < <(jq -er '.packages | if type == "array" and length == 8 then . else error("expected eight package rows") end | .[].package_id' release-evidence/sealed-manifest.json)
          signature_args=()
          for package_id in "${package_ids[@]}"; do
            signature_args+=(--package-id "$package_id")
          done
          if [ "$status" -eq 0 ]; then
            python3 eng/release_contract.py repository-signatures \
              --transcript verification-evidence/published-repository-signatures.txt \
              --version "$RELEASE_VERSION" \
              "${signature_args[@]}" \
              --output verification-evidence/published-repository-signatures.json || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            python3 eng/release_evidence.py partial-publish-incident \
              --manifest release-evidence/sealed-manifest.json \
              --output verification-evidence/partial-publish-incident.json \
              --phase post-seal-verification \
              --tag "$RELEASE_TAG"
            echo "NuGet-served bytes failed independent NuGet.org repository-signature verification." >&2
            exit 1
          fi

      - name: Compose verification ledger record
        if: always() && steps.disposition.outputs.governed-attempt == 'true'
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg run "$UPSTREAM_RUN_ID" \
            --arg conclusion "$UPSTREAM_CONCLUSION" \
            --argjson incident "$([ -f verification-evidence/partial-publish-incident.json ] && echo true || echo false)" \
            --argjson manifest "$([ "$(jq -r '.status // ""' verification-evidence/manifest-verification.json 2>/dev/null)" = valid ] && echo true || echo false)" \
            --argjson bytes "$([ "$(jq -r '.status // ""' verification-evidence/published-byte-comparison.json 2>/dev/null)" = verified ] && echo true || echo false)" \
            --argjson signatures "$(jq -e '.ok == true and .package_count == 8' verification-evidence/published-repository-signatures.json >/dev/null 2>&1 && echo true || echo false)" \
            '{decision_contract:"frontcomposer.release-ledger-record.v2",tag:$tag,release_run_id:$run,release_run_conclusion:$conclusion,manifest_verified:$manifest,published_bytes_verified:$bytes,repository_signatures_verified:$signatures,partial_publish_incident:$incident,disposition:(if ($manifest and $bytes and $signatures and ($incident|not)) then "compliant-candidate" else "non-compliant" end)}' \
            > verification-evidence/ledger-record.json

      - name: Upload verification evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-evidence/**
          if-no-files-found: error
          retention-days: 90
