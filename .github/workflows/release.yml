name: Release

# Operator-controlled production release. The unprotected jobs authenticate the
# exact current main commit and its successful push CI before any production job
# can start. Semantic Release decides whether that exact source is releasable.
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILDS_EXECUTION_SHA: 0a3508b3e5685602dc13983c5371cab7fabaf015
  EXPECTED_PACKAGE_COUNT: '8'

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      ci-run-id: ${{ steps.ci.outputs.run-id }}
      ci-run-attempt: ${{ steps.ci.outputs.run-attempt }}
      candidate: ${{ steps.ci.outputs.candidate }}
      policy-commit: ${{ steps.handoff.outputs.policy-commit }}
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Authenticate current main and successful push CI
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatched source SHA is malformed." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$DISPATCH_SHA" ]; then
            echo "The checkout does not match the dispatched source SHA." >&2
            exit 1
          fi
          mkdir -p artifacts/release-source
          gh api "repos/${REPOSITORY}/git/ref/heads/main" > artifacts/release-source/main-ref.json
          gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&head_sha=${DISPATCH_SHA}&per_page=100" \
            > artifacts/release-source/ci-runs.json
          python3 eng/release_contract.py select-ci \
            --dispatch-sha "$DISPATCH_SHA" \
            --main-ref artifacts/release-source/main-ref.json \
            --runs artifacts/release-source/ci-runs.json \
            --output artifacts/release-source/selected-ci.json
          run_id="$(jq -er '.run_id' artifacts/release-source/selected-ci.json)"
          run_attempt="$(jq -er '.run_attempt' artifacts/release-source/selected-ci.json)"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run-attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "candidate=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and validate the AD-13 CI handoff
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.run-attempt }}
        run: |
          set -euo pipefail
          artifact_name="dependency-release-handoff-${CI_RUN_ID}-${CI_RUN_ATTEMPT}"
          gh api "repos/${REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100" \
            > artifacts/release-source/ci-artifacts.json
          python3 - "$artifact_name" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path("artifacts/release-source/ci-artifacts.json").read_text())
          if not isinstance(payload, dict) or not isinstance(payload.get("total_count"), int) or not isinstance(payload.get("artifacts"), list):
              raise SystemExit("malformed CI artifact API response")
          if payload["total_count"] != len(payload["artifacts"]):
              raise SystemExit("ambiguous or paginated CI artifact API response")
          matches = [row for row in payload["artifacts"] if isinstance(row, dict) and row.get("name") == sys.argv[1] and row.get("expired") is False]
          if len(matches) != 1 or not isinstance(matches[0].get("id"), int) or matches[0]["id"] < 1:
              raise SystemExit(
                  "expected exactly one non-expired AD-13 dependency-release-handoff artifact; "
                  f"found {len(matches)}. Push CI must emit hexalith.dependency-release-handoff.v1 "
                  "under an active-policy-authorized evaluator (AD-13/AD-16)."
              )
          Path("artifacts/release-source/artifact-id.txt").write_text(str(matches[0]["id"]) + "\n")
          PY
          artifact_id="$(tr -d '\r\n' < artifacts/release-source/artifact-id.txt)"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > artifacts/release-source/handoff.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("artifacts/release-source/handoff.zip")
          with zipfile.ZipFile(archive) as source:
              names = source.namelist()
              if names != ["dependency-release-handoff.json"] or any(PurePosixPath(name).is_absolute() or ".." in PurePosixPath(name).parts for name in names):
                  raise SystemExit("AD-13 handoff artifact archive has an unexpected shape")
              source.extractall("artifacts/release-source/ci-handoff")
          PY
          handoff="artifacts/release-source/ci-handoff/dependency-release-handoff.json"
          # `--live` re-derives the exact candidate graph, which needs an object store for every
          # root-declared dependency. This job checks out with `submodules: false` on purpose, so
          # acquire those stores from active-policy-approved identities first -- the same
          # acquisition push CI performs -- rather than trusting candidate `.gitmodules` URLs.
          # Without it the re-derivation ran git inside an empty submodule directory, walked up to
          # the superproject, and failed closed with `fatal: not a tree object`.
          object_root="$RUNNER_TEMP/release-source-object-stores"
          handoff_base="$(jq -er '.revisions.base' "$handoff")"
          handoff_candidate="$(jq -er '.revisions.candidate' "$handoff")"
          python3 eng/dependency_graph.py acquire \
            --event-base "$handoff_base" \
            --candidate "$handoff_candidate" \
            --destination "$object_root" \
            > artifacts/release-source/object-acquisition.json
          python3 eng/dependency_handoff.py --root "$object_root" verify-ci --handoff "$handoff" --live
          jq -e \
            --arg sha "$DISPATCH_SHA" \
            --argjson run "$CI_RUN_ID" \
            --argjson attempt "$CI_RUN_ATTEMPT" \
            '.run.candidate == $sha and .revisions.candidate == $sha and .run.run_id == $run and .run.run_attempt == $attempt' \
            "$handoff" > /dev/null
          policy_commit="$(jq -er '.dependency_policy.commit' "$handoff")"
          echo "policy-commit=$policy_commit" >> "$GITHUB_OUTPUT"

      - name: Validate approved package boundary
        run: |
          python3 eng/release_contract.py builds \
            --root . \
            --commit "${{ github.sha }}" \
            --approved "$BUILDS_EXECUTION_SHA"
          python3 eng/release_contract.py manifest \
            --root . \
            --manifest tools/release-packages.json \
            --expected-count 8

      - name: Carry authenticated AD-13 handoff into this release run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ci-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-source/ci-handoff/dependency-release-handoff.json
          if-no-files-found: error
          retention-days: 30

  plan-release:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release-required: ${{ steps.plan.outputs.release-required }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Initialize Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install release tooling
        run: |
          npm ci
          npm audit signatures
      - name: Compute release decision without publication side effects
        id: plan
        run: |
          set -euo pipefail
          node eng/semantic-release-plan.mjs > release-plan.json
          required="$(jq -er '.release_required | if . then "true" else "false" end' release-plan.json)"
          version="$(jq -r '.version // ""' release-plan.json)"
          if [ "$required" = "true" ] && [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Semantic Release returned a malformed version." >&2
            exit 1
          fi
          echo "release-required=$required" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "Release v${version} is required for exact source $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No releasable commits were found for exact source $GITHUB_SHA; no publication was attempted." >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare-candidate:
    needs: [verify-source, plan-release]
    if: needs.plan-release.outputs.release-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Checkout approved Builds actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Hexalith/Hexalith.Builds
          ref: 0a3508b3e5685602dc13983c5371cab7fabaf015
          path: .hexalith/builds-execution
          persist-credentials: false
      - name: Initialize root-declared dependencies
        uses: ./.hexalith/builds-execution/Github/initialize-build
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Initialize Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install release tooling for governance tests
        run: npm ci
      - name: Restore authenticated AD-13 CI handoff and draft Release evaluator
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_COMMIT: ${{ needs.verify-source.outputs.policy-commit }}
          CANDIDATE: ${{ needs.verify-source.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-source
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "release-ci-handoff-${{ github.run_id }}-${{ github.run_attempt }}" \
            --dir artifacts/release-source
          test -f artifacts/release-source/dependency-release-handoff.json
          python3 eng/dependency_handoff.py verify-ci \
            --handoff artifacts/release-source/dependency-release-handoff.json \
            --live
          python3 eng/dependency_handoff.py draft-evaluator \
            --stage release \
            --caller-commit "$CANDIDATE" \
            --caller-workflow .github/workflows/release.yml \
            --policy-commit "$POLICY_COMMIT" \
            --output artifacts/release-source/release-evaluator.json
      - name: Revalidate current main before using protected credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$live" =~ ^[0-9a-f]{40}$ ]] || [ "$live" != "$DISPATCH_SHA" ]; then
            echo "main advanced or returned an ambiguous source identity; redispatch after AD-13 CI handoff succeeds." >&2
            exit 1
          fi
      - name: Prepare and seal the pack-once candidate
        env:
          DEPENDENCY_RELEASE_HANDOFF: artifacts/release-source/dependency-release-handoff.json
          RELEASE_EVALUATOR: artifacts/release-source/release-evaluator.json
          HEXALITH_BUILDS_EXECUTION_SHA: 0a3508b3e5685602dc13983c5371cab7fabaf015
          RELEASE_ATTESTATION_STATUS: ${{ vars.RELEASE_ATTESTATION_STATUS || 'approved-unsupported' }}
          RELEASE_ATTESTATION_FALLBACK_APPROVER: ${{ vars.RELEASE_ATTESTATION_FALLBACK_APPROVER }}
          RELEASE_ATTESTATION_FALLBACK_APPROVED_AT: ${{ vars.RELEASE_ATTESTATION_FALLBACK_APPROVED_AT }}
          RELEASE_ATTESTATION_FALLBACK_EXPIRES_AT: ${{ vars.RELEASE_ATTESTATION_FALLBACK_EXPIRES_AT }}
        run: |
          python3 eng/release_prepublish.py prepare --version "${{ needs.plan-release.outputs.version }}"
          python3 eng/release_prepublish.py bundle --version "${{ needs.plan-release.outputs.version }}"
      - name: Upload run-bound prepared candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nupkgs/**/*.nupkg
            nupkgs/**/*.snupkg
            release-evidence/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  release:
    needs: [plan-release, prepare-candidate]
    if: needs.plan-release.outputs.release-required == 'true' && needs.prepare-candidate.result == 'success'
    # BUILD-REL-1 domain-release.yml declares a sibling governed-release job with
    # id-token/attestations. GitHub validates reusable-workflow permissions against
    # every callee job statically, so the caller must grant those scopes even while
    # FrontComposer stays on the legacy path (governed-release left unset/false).
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@0a3508b3e5685602dc13983c5371cab7fabaf015
    with:
      solution: Hexalith.FrontComposer.slnx
      test-projects: ''
      timeout-minutes: 60
      environment-name: production
      publish-containers: false
      container-projects: ''
      builds-execution-sha: 0a3508b3e5685602dc13983c5371cab7fabaf015
      source-branch: main
      source-ci-workflow: ci.yml
      package-manifest: tools/release-packages.json
      expected-package-count: 8
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  verify-publication:
    needs: [plan-release, release]
    if: always() && needs.plan-release.outputs.release-required == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Require a non-draft release tag resolving to the dispatched SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mkdir -p release-verification
          if ! gh api "repos/${REPOSITORY}/releases/tags/${tag}" > release-verification/github-release.json; then
            echo "Semantic Release completed without the required GitHub Release; publication is inconsistent." >&2
            exit 1
          fi
          if ! jq -e --arg tag "$tag" '
            type == "object" and .tag_name == $tag and .draft == false and .immutable == true and
            (.id | type == "number") and (.assets | type == "array") and (.assets | length > 0)
          ' release-verification/github-release.json > /dev/null; then
            echo "GitHub Release metadata is mutable, draft, empty, or malformed." >&2
            exit 1
          fi
          gh api "repos/${REPOSITORY}/git/ref/tags/${tag}" > release-verification/tag-ref.json
          echo '[]' > release-verification/tag-objects.json
          object_type="$(jq -er '.object.type' release-verification/tag-ref.json)"
          object_sha="$(jq -er '.object.sha' release-verification/tag-ref.json)"
          for _ in 1 2 3 4 5; do
            if [ "$object_type" = "commit" ]; then
              break
            fi
            if [ "$object_type" != "tag" ] || [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release tag API response is malformed or ambiguous." >&2
              exit 1
            fi
            gh api "repos/${REPOSITORY}/git/tags/${object_sha}" > release-verification/tag-object.json
            jq --slurpfile item release-verification/tag-object.json '. + $item' \
              release-verification/tag-objects.json > release-verification/tag-objects.next.json
            mv release-verification/tag-objects.next.json release-verification/tag-objects.json
            object_type="$(jq -er '.object.type' release-verification/tag-object.json)"
            object_sha="$(jq -er '.object.sha' release-verification/tag-object.json)"
          done
          if [ "$object_type" != "commit" ] || [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$object_sha" != "$DISPATCH_SHA" ]; then
            echo "The GitHub Release tag does not resolve to the exact dispatched SHA." >&2
            exit 1
          fi
          python3 eng/release_contract.py publication \
            --expected-sha "$DISPATCH_SHA" \
            --expected-tag "$tag" \
            --release release-verification/github-release.json \
            --tag-ref release-verification/tag-ref.json \
            --tag-objects release-verification/tag-objects.json \
            --require-immutable
          echo "Published ${tag} from exact source ${DISPATCH_SHA}." >> "$GITHUB_STEP_SUMMARY"

  # AD-15: every governed Release attempt emits exactly one verification handoff.
  emit-verification-handoff:
    needs: [verify-source, plan-release, prepare-candidate, release, verify-publication]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact dispatched source
        if: always()
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Emit AD-15 release-verification-handoff
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VERIFY_RESULT: ${{ needs.verify-source.result }}
          PLAN_RESULT: ${{ needs.plan-release.result }}
          PREPARE_RESULT: ${{ needs.prepare-candidate.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          PUBLICATION_RESULT: ${{ needs.verify-publication.result }}
          POLICY_COMMIT: ${{ needs.verify-source.outputs.policy-commit }}
          CANDIDATE: ${{ needs.verify-source.outputs.candidate }}
          VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-verification-handoff
          conclusion="failure"
          if [ "$VERIFY_RESULT" = "success" ] && [ "$PLAN_RESULT" = "success" ]; then
            if [ "$PREPARE_RESULT" = "skipped" ] && [ "$RELEASE_RESULT" = "skipped" ] && [ "$PUBLICATION_RESULT" = "skipped" ]; then
              conclusion="success"
            elif [ "$PREPARE_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ] && [ "$PUBLICATION_RESULT" = "success" ]; then
              conclusion="success"
            elif [ "$PREPARE_RESULT" = "skipped" ] || [ "$RELEASE_RESULT" = "skipped" ] || [ "$PUBLICATION_RESULT" = "skipped" ]; then
              conclusion="cancelled"
            else
              conclusion="failure"
            fi
          fi
          published=false
          version_json=null
          tag_json=null
          release_id_json=null
          manifest_path_json=null
          manifest_sha_json=null
          manifest_seal_json=null
          echo '[]' > artifacts/release-verification-handoff/assets.json
          # NuGet/GitHub side effects land in the release job; treat that success as published
          # even when verify-publication never ran, so AD-15 cannot soft-defer afterward.
          publication_attempted=false
          if [ "$RELEASE_RESULT" = "success" ] || [ "$PUBLICATION_RESULT" = "success" ]; then
            publication_attempted=true
          fi
          if [ "$VERIFY_RESULT" != "success" ] || [ -z "${POLICY_COMMIT:-}" ] || [ -z "${CANDIDATE:-}" ]; then
            jq -n \
              --arg error "AD-13 CI handoff was not authenticated; AD-15 emission deferred" \
              '{ok:false,deferred:true,error:$error}' \
              > artifacts/release-verification-handoff/release-verification-handoff.deferred.json
            if [ "$publication_attempted" = "true" ]; then
              echo "::error::AD-15 cannot soft-succeed after publication when AD-13 CI handoff is unavailable"
              exit 1
            fi
            echo "AD-15 deferred: AD-13 CI handoff unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name "release-ci-handoff-${RUN_ID}-${RUN_ATTEMPT}" \
            --dir artifacts/release-verification-handoff/ci
          ci_handoff="artifacts/release-verification-handoff/ci/dependency-release-handoff.json"
          test -f "$ci_handoff"
          python3 eng/dependency_handoff.py draft-evaluator \
            --stage release \
            --caller-commit "$CANDIDATE" \
            --caller-workflow .github/workflows/release.yml \
            --policy-commit "$POLICY_COMMIT" \
            --output artifacts/release-verification-handoff/release-evaluator.json
          if [ "$publication_attempted" = "true" ]; then
            if [ -z "${VERSION:-}" ]; then
              echo "::error::AD-15 published attempt lacks a release VERSION coordinate"
              exit 1
            fi
            published=true
            version_json="$(jq -n --arg v "$VERSION" '$v')"
            tag_json="$(jq -n --arg v "v${VERSION}" '$v')"
            if ! gh api "repos/${REPOSITORY}/releases/tags/v${VERSION}" > artifacts/release-verification-handoff/github-release.json; then
              echo "::error::AD-15 published release lacks a GitHub Release for v${VERSION}"
              exit 1
            fi
            release_id_json="$(jq -er '.id' artifacts/release-verification-handoff/github-release.json)"
            if [ "$PREPARE_RESULT" != "success" ]; then
              echo "::error::AD-15 published release requires a successful prepare-candidate artifact"
              exit 1
            fi
            gh run download "$RUN_ID" \
              --repo "$REPOSITORY" \
              --name "release-candidate-${RUN_ID}-${RUN_ATTEMPT}" \
              --dir artifacts/release-verification-handoff/candidate
            manifest="artifacts/release-verification-handoff/candidate/release-evidence/sealed-manifest.json"
            if [ ! -f "$manifest" ]; then
              echo "::error::AD-15 published release lacks sealed-manifest.json on the prepared candidate"
              exit 1
            fi
            manifest_path_json="$(jq -n --arg p "release-evidence/sealed-manifest.json" '$p')"
            manifest_sha_json="$(jq -n --arg h "$(sha256sum "$manifest" | awk '{print $1}')" '$h')"
            manifest_seal_json="$(jq -er '.seal' "$manifest")"
            manifest_seal_json="$(jq -n --arg h "$manifest_seal_json" '$h')"
            python3 eng/dependency_handoff.py materialize-release-assets \
              --release artifacts/release-verification-handoff/github-release.json \
              --candidate-root artifacts/release-verification-handoff/candidate \
              --output artifacts/release-verification-handoff/assets.json
          fi
          jq -n \
            --argjson published "$published" \
            --argjson version "$version_json" \
            --argjson tag "$tag_json" \
            --argjson github_release_id "$release_id_json" \
            '{version:$version,tag:$tag,github_release_id:$github_release_id,published:$published}' \
            > artifacts/release-verification-handoff/release.json
          jq -n \
            --argjson path "$manifest_path_json" \
            --argjson sha256 "$manifest_sha_json" \
            --argjson seal "$manifest_seal_json" \
            '{path:$path,sha256:$sha256,seal:$seal}' \
            > artifacts/release-verification-handoff/manifest.json
          set +e
          python3 eng/dependency_handoff.py create-release \
            --ci-handoff "$ci_handoff" \
            --release-run-id "$RUN_ID" \
            --release-run-attempt "$RUN_ATTEMPT" \
            --conclusion "$conclusion" \
            --evaluator artifacts/release-verification-handoff/release-evaluator.json \
            --policy-commit "$POLICY_COMMIT" \
            --release artifacts/release-verification-handoff/release.json \
            --manifest artifacts/release-verification-handoff/manifest.json \
            --assets artifacts/release-verification-handoff/assets.json \
            --output artifacts/release-verification-handoff/release-verification-handoff.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cp "$ci_handoff" artifacts/release-verification-handoff/dependency-release-handoff.json
            echo "AD-15 release-verification-handoff sealed (conclusion=$conclusion)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 2 ]; then
            if [ "$published" = "true" ]; then
              echo "::error::AD-15 create-release cannot soft-defer after publication"
              exit 1
            fi
            echo "AD-15 handoff deferred pending active-policy release evaluator authorization." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::AD-15 create-release failed unexpectedly (exit=$status)"
            exit "$status"
          fi

      - name: Upload AD-15 release-verification-handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-verification-handoff/
          if-no-files-found: error
          retention-days: 30
