name: CI

# REL-2 (2026-07-13): FrontComposer primary CI now delegates to the shared
# reusable Hexalith.Builds `domain-ci.yml`, matching Hexalith.Tenants so every
# Hexalith module shares one CI/CD operating model. FrontComposer-specific gates
# the reusable does not run (Contracts netstandard2.0 isolation, CLI tool smoke,
# Governance, Contract pacts, docs validation, quarantine/duration telemetry, and
# the Playwright a11y/visual lane) are retained as the explicitly-supplemental
# `quality.yml` workflow (PRD NFR-11). commitlint runs in `commitlint.yml`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@99d5a46c3d0db007b2d2f9c5e277a7d2c32b9a38
    with:
      solution: Hexalith.FrontComposer.slnx
      # Enables scripts/pack-release-packages.py + validate-nuget-packages.py +
      # validate-consumer-package-references.py (FR24 AC1 + AC6): proves the 8-package
      # inventory and the Contracts-only vs Shell/UI consumer boundaries before release.
      run-consumer-validation: true
      # Trait-clean Tier 1 projects only. Shell.Tests (Governance/Contract/Quarantined
      # lanes) and SourceTools.Tests (Performance/MutationErrorHandling lanes) need
      # trait filtering the reusable cannot express, so they run in quality.yml.
      unit-test-projects: |
        tests/Hexalith.FrontComposer.Cli.Tests
        tests/Hexalith.FrontComposer.Contracts.Tests
        tests/Hexalith.FrontComposer.Contracts.UI.Tests
        tests/Hexalith.FrontComposer.Testing.Tests

  # GOV-1 local gate. The exact-source proof deliberately covers only facts this
  # repository owns: the push-CI coordinate, active base policy, and candidate graph.
  # It does not fabricate an immutable closure for the shared domain-ci implementation.
  dependency-governance:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate and root-declared dependencies
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # Exact stores are acquired below from active-policy-approved identities.
          submodules: false

      - name: Select exact dependency revisions
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            event_base="$PULL_REQUEST_BASE"
          elif [ "$EVENT_NAME" = "push" ]; then
            event_base="$PUSH_BEFORE"
          else
            echo "::error::unsupported dependency-governance event: $EVENT_NAME"
            exit 1
          fi
          test -n "$event_base"
          test -n "$CANDIDATE"
          echo "event=$EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "event-base=$event_base" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Collect exact graph diff and affected-module proof
        id: dependency-diff
        shell: bash
        env:
          EVENT_NAME: ${{ steps.revisions.outputs.event }}
          EVENT_BASE: ${{ steps.revisions.outputs.event-base }}
          CANDIDATE: ${{ steps.revisions.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependency-governance
          object_root="$RUNNER_TEMP/dependency-object-stores"
          echo "object-root=$object_root" >> "$GITHUB_OUTPUT"
          # Acquisition writes its fail-closed reason to the evidence file, not to stderr.
          # Aborting here on `set -e` left `exit-code` unset, so the enforcement step could
          # only report `exit=` with the reason buried in an artifact. Capture the status,
          # publish it, and echo the reason into the log instead.
          set +e
          python3 eng/dependency_graph.py acquire \
            --event-base "$EVENT_BASE" \
            --candidate "$CANDIDATE" \
            --destination "$object_root" \
            > artifacts/dependency-governance/object-acquisition.json
          acquire_status=$?
          set -e
          if [ "$acquire_status" != "0" ]; then
            echo "exit-code=$acquire_status" >> "$GITHUB_OUTPUT"
            echo "::error::exact-object acquisition failed (exit=$acquire_status)"
            cat artifacts/dependency-governance/object-acquisition.json
            exit "$acquire_status"
          fi
          set +e
          python3 eng/dependency_graph.py --root "$object_root" diff \
            --event "$EVENT_NAME" \
            --event-base "$EVENT_BASE" \
            --candidate "$CANDIDATE" \
            > artifacts/dependency-governance/dependency-graph-diff.json
          status=$?
          set -e
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          echo "object-root=$object_root" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/dependency-governance/dependency-graph-diff.json").read_text())
          evidence = payload.get("evidence", {})
          error = payload.get("error")
          print(f"graph diff ok={payload.get('ok')} changes={len(evidence.get('changes', []))} affected={len(evidence.get('affected_modules', []))}")
          if payload.get("ok") is False and error:
              print(f"::error::{error}")
          PY

      - name: Build policy-authorized affected modules
        if: steps.dependency-diff.outputs.exit-code == '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/dependency_graph.py --root "${{ steps.dependency-diff.outputs.object-root }}" run-affected \
            --evidence artifacts/dependency-governance/dependency-graph-diff.json \
            --output-root "$RUNNER_TEMP/hexalith-affected-modules" \
            > artifacts/dependency-governance/affected-module-results.json

      - name: Create exact-source release proof
        if: github.event_name == 'push' && steps.dependency-diff.outputs.exit-code == '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/dependency_handoff.py create-source \
            --evidence artifacts/dependency-governance/dependency-graph-diff.json \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --output artifacts/dependency-governance/dependency-release-source.json

      - name: Upload exact-source release proof
        if: github.event_name == 'push' && steps.dependency-diff.outputs.exit-code == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-release-source-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/dependency-governance/dependency-release-source.json

      # AD-13 producer. Always invokes create_ci_handoff via create-ci. Empty
      # evaluator_authorizations or an unauthorized draft fail closed with exit 2
      # (deferred diagnostic) so the graph gate stays green until AD-16 populates
      # an owner-accepted immutable reusable/action closure in policy.
      - name: Create AD-13 dependency-release-handoff
        id: ad13-handoff
        if: github.event_name == 'push' && steps.dependency-diff.outputs.exit-code == '0'
        shell: bash
        env:
          OBJECT_ROOT: ${{ steps.dependency-diff.outputs.object-root }}
          CANDIDATE: ${{ steps.revisions.outputs.candidate }}
          EVENT_BASE: ${{ steps.revisions.outputs.event-base }}
        run: |
          set -euo pipefail
          policy_commit="$EVENT_BASE"
          if [ "$policy_commit" = "0000000000000000000000000000000000000000" ]; then
            policy_commit="$CANDIDATE"
          fi
          python3 eng/dependency_handoff.py --root "$OBJECT_ROOT" draft-evaluator \
            --stage ci \
            --caller-commit "$CANDIDATE" \
            --caller-workflow .github/workflows/ci.yml \
            --policy-commit "$policy_commit" \
            --output artifacts/dependency-governance/ci-evaluator.json
          set +e
          python3 eng/dependency_handoff.py --root "$OBJECT_ROOT" create-ci \
            --evidence artifacts/dependency-governance/dependency-graph-diff.json \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --evaluator artifacts/dependency-governance/ci-evaluator.json \
            --output artifacts/dependency-governance/dependency-release-handoff.json
          status=$?
          set -e
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "AD-13 handoff deferred pending active-policy evaluator authorization (AD-16)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::AD-13 create-ci failed unexpectedly (exit=$status)"
            exit "$status"
          fi

      - name: Upload AD-13 dependency-release-handoff
        if: github.event_name == 'push' && steps.ad13-handoff.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/dependency-governance/dependency-release-handoff.json

      - name: Upload deterministic dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-graph-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/dependency-governance/*.json

      - name: Enforce dependency-governance result
        if: always()
        shell: bash
        env:
          DIFF_EXIT_CODE: ${{ steps.dependency-diff.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [ "$DIFF_EXIT_CODE" != "0" ]; then
            echo "::error::dependency graph diff/affected-module gate failed closed (exit=$DIFF_EXIT_CODE)"
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/dependency-governance/dependency-graph-diff.json")
          if path.is_file():
              payload = json.loads(path.read_text())
              error = payload.get("error")
              if error:
                  print(f"::error::{error}")
          PY
            exit 1
          fi
